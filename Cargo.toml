[package]
name = "deploytool"
version = "0.4.0"
edition = "2024"
authors = ["Michal Švrček"]
description = "A cross-platform Rust CLI tool for deploying applications to remote devices."
license = "MIT"

[[bin]]
name = "deploy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
colored = "3"
chrono = { version = "0.4", features = ["serde", "clock"] }
fs2 = "0.4"