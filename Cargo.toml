
[package]
name = "deploytool"
version = "0.1.0"
edition = "2024"
authors = ["Michal Švrček"]
description = "A cross-platform Rust CLI tool for deploying applications to remote devices."
license = "MIT"

[[bin]]
name = "deploy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
